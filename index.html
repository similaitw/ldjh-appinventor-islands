<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="十一座虛擬島嶼的 App Inventor 冒險 RPG：從設計師、事件到感測器，一站一站學會做手機 App。">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>App Inventor 群島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 3D hex archipelago (one island per App Inventor topic, joined by a learning route) beside a long-form island guide */
:root{
  --bg:#eef5f4; --surface:#ffffff; --fg:#1f2d33; --muted:#5b6d73; --line:#d3e2e0; --well:#e6efed; --code:#f3f7f6;
  --sea:#bfe3ea; --sea-deep:#8cc9d6; --sand:#f1dfb3; --grass:#8fcf6b; --cliff:#c9a77a;
  --slot:#ffffff; --slot-text:#3b3b3b;
  --accent:#ff8c1a; --ok:#2e9e5b; --bad:#d6453d; --kw:#7a3fd1; --str:#2b8a3e; --cm:#7b8b8f;
  --display:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1c22; --surface:#16272e; --fg:#e4efee; --muted:#9db3b6; --line:#28414a; --well:#0f1c22; --code:#0c171c;
  --sea:#123845; --sea-deep:#0b2a35; --sand:#bfa978; --grass:#5f9e4a; --cliff:#8a7254;
  --slot:#f2f5f3; --slot-text:#2a2a2a; --accent:#ffa64d; --ok:#5cc98a; --bad:#f07a72; --kw:#c49bff; --str:#7fd492; --cm:#7f9599;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c22; --surface:#16272e; --fg:#e4efee; --muted:#9db3b6; --line:#28414a; --well:#0f1c22; --code:#0c171c;
  --sea:#123845; --sea-deep:#0b2a35; --sand:#bfa978; --grass:#5f9e4a; --cliff:#8a7254;
  --slot:#f2f5f3; --slot-text:#2a2a2a; --accent:#ffa64d; --ok:#5cc98a; --bad:#f07a72; --kw:#c49bff; --str:#7fd492; --cm:#7f9599;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,4.5vw,2.2rem);margin:0;line-height:1.15;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:.92rem;max-width:62ch}
.progress{font-family:var(--display);font-weight:600;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.progress b{color:var(--accent)}
.swatches{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.swatches i{width:18px;height:8px;border-radius:4px;display:block}

.main{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:960px){.main{grid-template-columns:minmax(0,1.75fr) minmax(340px,1fr);align-items:start}}
.stage{position:relative;height:min(62svh,600px);min-height:340px;border-radius:18px;overflow:hidden;background:var(--sea);touch-action:none;border:1px solid var(--line)}
@media (min-width:960px){.stage{height:calc(100vh - 32px);max-height:900px;position:sticky;top:16px}}
/* 桌機：整個畫面剛好塞進視窗，地圖填滿高度，教學面板在自己的欄位裡捲動 */
@media (min-width:960px) and (min-height:560px){
  html,body{height:100%;overflow:hidden}
  body{padding-block:12px;box-sizing:border-box}
  .wrap{height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  header{flex:none}
  header .sub{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;max-width:80ch}
  .main{flex:1;min-height:0;align-items:stretch}
  .stage{height:auto;max-height:none;min-height:0;position:relative;top:auto}
  .panel{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;
  padding:3px 10px 3px 3px;border-radius:999px;border:0;background:var(--surface);color:var(--fg);font-family:var(--body);font-weight:700;font-size:13px;line-height:1.2;
  box-shadow:0 3px 10px rgba(40,60,60,.18);will-change:transform;transition:opacity .35s;backface-visibility:hidden}
.lbl:hover{z-index:2}
.lbl b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--display);font-size:13px;border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.lbl .done{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--well);color:var(--fg);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.lbl .done.dn{background:var(--ok);color:#fff}
.lbl.on{outline:3px solid var(--c);outline-offset:1px}
.labels.focused .lbl{opacity:0;pointer-events:none}
.lbl.padlbl{pointer-events:none;font-size:12px;padding:2px 10px 2px 2px}
.lbl.padlbl b{background:#58616b;width:24px;height:24px;font-size:12px}

.labels.narrow .lbl{padding:2px;gap:0}
.labels.narrow .lbl .nm,.labels.narrow .lbl .done{display:none}
.labels.narrow .lbl b{width:26px;height:26px;font-size:12px;border-width:2px}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--fg);opacity:.75;pointer-events:none}
.overview{position:absolute;top:10px;left:10px;font-size:13px;padding:6px 12px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;box-shadow:0 2px 0 var(--line)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 22px;display:flex;flex-direction:column;gap:18px;min-width:0;border-top:6px solid var(--c)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);display:block}
.panel h2{font-family:var(--display);font-size:1.6rem;margin:2px 0 0;line-height:1.2;text-wrap:balance}
.panel h3{font-size:1.02rem;margin:0 0 6px;font-weight:900;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--c)}
.panel p{margin:0 0 8px;max-width:64ch}
.panel p:last-child{margin-bottom:0}
.panel ul,.panel ol{margin:0 0 8px;padding-left:1.3em;max-width:64ch}
.panel li{margin:2px 0}
.panel b{font-weight:700}
.learn{display:flex;flex-wrap:wrap;gap:6px}
.learn span{font-size:.8rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--well)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.panel code{font-family:var(--mono);font-size:.88em;background:var(--well);padding:0 5px;border-radius:4px}
.panel pre code{background:none;padding:0;font-size:1em}
.tabs button{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.88rem}
.tabs button[aria-selected="true"]{background:var(--c);border-color:var(--cd);color:#fff}
.tabs button .s{color:var(--accent);margin-left:3px}
.tabs button[aria-selected="true"] .s{color:#fff}
.blocks{display:flex;flex-direction:column;gap:12px}
.brow{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:flex-start}
.brow small{color:var(--muted);font-size:.86rem}

/* App Inventor (Blockly) style blocks: colors from --c / --cd on the nearest ancestor */
.blk{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;max-width:100%;
  background:var(--c);color:#fff;border:1px solid var(--cd);font-size:13px;font-weight:500;line-height:1.35}
.rep{border-radius:999px;padding:4px 11px}
.bool{clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);border:none;padding:5px 20px}
.stk{border-radius:5px;padding:7px 12px}
.hat{border-radius:22px 22px 5px 5px;padding:13px 14px 7px}
.cblk{display:inline-flex;flex-direction:column;align-items:stretch;max-width:100%;background:var(--c);border:1px solid var(--cd);border-radius:5px;color:#fff;font-size:13px;font-weight:500;line-height:1.35}
.cblk .head,.cblk .mid{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:7px 12px}
.cblk .mouth{margin-left:16px;background:var(--surface);border-radius:4px 0 0 4px;padding:3px 0 3px 3px;min-height:22px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cblk .foot{height:12px}
.blk .rep,.blk .bool{border:1px solid var(--cd);filter:brightness(.96)}
.slot{display:inline-block;background:var(--slot);color:var(--slot-text);border-radius:999px;padding:0 9px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.slot.b{background:var(--cd);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);border-radius:0;padding:0 14px;min-width:36px;color:#fff}
.dd{background:var(--cd);border-radius:4px;padding:0 6px}
.script{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;background:var(--well);border-radius:12px;overflow-x:auto;max-width:100%}
.steps{margin-top:8px}
.steps li::marker{color:var(--c);font-weight:700}

.codebox{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.langs{display:flex;border-bottom:1px solid var(--line);background:var(--well)}
.langs button{background:transparent;color:var(--muted);border:none;border-radius:0;padding:6px 14px;font-size:.85rem}
.langs button[aria-selected="true"]{color:var(--fg);background:var(--code);box-shadow:inset 0 -3px 0 var(--c)}
pre{margin:0;padding:12px 14px;background:var(--code);overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.6;tab-size:4}
pre .k{color:var(--kw);font-weight:600} pre .s{color:var(--str)} pre .c{color:var(--cm);font-style:italic}
.oops li::marker{content:"✗  ";color:var(--bad);font-weight:700}

.tip{background:var(--well);border-radius:12px;padding:10px 12px;font-size:.92rem;border-left:4px solid var(--accent)}
.quest{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.quest .q{font-weight:700;line-height:2.1}
.quest .q .blk,.quest .q .cblk{vertical-align:middle;line-height:1.35;margin:2px 0}
.ans{display:flex;gap:8px;flex-wrap:wrap}
.ans input{flex:1 1 140px;min-width:0;font:inherit;font-size:16px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.choices{display:flex;flex-direction:column;gap:6px}
.choices button{text-align:left;background:var(--bg);color:var(--fg);border:1px solid var(--line);font-weight:500}
.choices button.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.choices button.wrong{border-color:var(--bad);color:var(--bad)}
.ans input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:8px 16px;border:1px solid var(--cd);background:var(--c);color:#fff}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.nav{display:flex;gap:8px;flex-wrap:wrap}

.ihead{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px}
.pbar,.mbar{flex:1;height:10px;border-radius:999px;background:var(--well);overflow:hidden;border:1px solid var(--line)}
.pbar i,.mbar i{display:block;height:100%;width:0;background:var(--c);border-radius:999px;transition:width .4s}
.pct{font-family:var(--display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.got{display:flex;justify-content:flex-end;margin-top:8px}
.got button{background:transparent;color:var(--muted);border:1px dashed var(--line);font-size:.85rem;padding:5px 12px}
.got button[aria-pressed="true"]{background:var(--c);color:#fff;border:1px solid var(--cd)}
.h3s{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--ok)}
.tabs button .tp{font-size:.75rem;opacity:.8;margin-left:4px;font-variant-numeric:tabular-nums}
.finish{border:2px solid var(--c);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--well)}
.finish b{font-size:1.05rem}
.travel{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;z-index:5000;background:rgba(10,25,30,.45);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{background:var(--surface);color:var(--fg);border-radius:18px;border-top:6px solid var(--c);padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
.modal h3{margin:0;font-size:1.15rem}
.modal p{margin:0}
.modal .mbar{flex:none}

:root{--warn:#a85d00;--warn-bg:#fff3df;--warn-line:#f0b25a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--warn:#ffc266;--warn-bg:#33240c;--warn-line:#8a5a14}}
:root[data-theme="dark"]{--warn:#ffc266;--warn-bg:#33240c;--warn-line:#8a5a14}
.pts{margin:0;padding-left:1.2em}
.pts li{margin:3px 0}
.pts li::marker{color:var(--c)}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-line);border-left:5px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:.92rem;color:var(--fg)}
.warnbox b{color:var(--warn)}
.warnbox ul{margin:4px 0;padding-left:1.2em}
button.warnbtn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.modal .card.warn{border-top-color:var(--warn);background:var(--surface)}
.modal .card.warn h3{color:var(--warn)}
.modal .card.warn #mBody{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:8px 12px}
.modal ul{margin:4px 0 6px;padding-left:1.2em}

/* ---------- RPG HUD ---------- */
.hud{position:absolute;top:10px;right:10px;z-index:3000;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--fg);border:2px solid var(--hc);border-radius:16px;padding:6px 8px;box-shadow:0 3px 0 var(--line);max-width:calc(100% - 20px)}
.hud-face{width:42px;height:42px;border-radius:50%;padding:0;background:var(--hc);border:2px solid var(--surface);box-shadow:0 0 0 2px var(--hc);color:#fff;font-family:var(--display);font-size:1.2rem;flex:none}
.hud-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.hud-top{display:flex;align-items:baseline;gap:6px;white-space:nowrap;overflow:hidden;font-size:13px}
.hud-top b{max-width:7em;overflow:hidden;text-overflow:ellipsis}
.hud-lv{font-family:var(--display);font-weight:700;color:var(--hc)}
.hud-title{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.hud-xp{height:7px;border-radius:999px;background:var(--well);border:1px solid var(--line);overflow:hidden;min-width:150px}
.hud-xp i{display:block;height:100%;background:linear-gradient(90deg,var(--hc),var(--accent));transition:width .5s}
.hud-row{display:flex;align-items:center;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}
.hearts{color:#e2483d;letter-spacing:1px;font-size:13px}
.hearts s{color:var(--line);text-decoration:none}
.coin,.tc{display:inline-flex;align-items:center;gap:3px;font-weight:700}
.coin i,.tc i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a0,#f2b300 60%,#b37f00);display:inline-block;box-shadow:0 0 0 1px #b37f00}
.hud-xpn{color:var(--muted)}
.hud-bag{padding:6px 10px;font-size:12px;background:var(--hc);border-color:var(--hc);flex:none}
.clock{position:absolute;right:10px;bottom:10px;z-index:3000;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-size:12px;box-shadow:0 2px 0 var(--line)}
.clock .ph{font-weight:700}
.clock .tm{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.clock button{padding:3px 10px;font-size:12px;border-radius:999px;background:var(--well);color:var(--fg);border:1px solid var(--line)}
.clock button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.toasts{position:absolute;top:76px;right:12px;z-index:3100;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.toast{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:5px 12px;font-size:13px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.12);animation:tin .3s ease-out}
.toast.big{font-size:15px;border-left-color:#ffd23f;background:var(--warn-bg)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.dlg{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);z-index:3050;width:min(560px,calc(100% - 24px));background:var(--surface);color:var(--fg);border:3px solid var(--c);border-radius:16px;padding:12px 14px 10px;box-shadow:0 6px 0 var(--cd),0 10px 30px rgba(0,0,0,.18)}
.dlg-who{position:absolute;top:-14px;left:14px;background:var(--c);color:#fff;font-weight:700;font-size:13px;padding:1px 12px;border-radius:999px;border:2px solid var(--cd)}
.dlg-text{margin:6px 0 8px;min-height:3.2em;font-size:15px;line-height:1.6}
.dlg-nav{display:flex;justify-content:flex-end;gap:8px}
.dlg-nav button{padding:5px 14px;font-size:13px}
.modal .card.wide{max-width:520px;max-height:calc(100vh - 40px);overflow:auto}
.muted{color:var(--muted);font-size:.9rem}
.fl{display:block;font-weight:700;font-size:.85rem;margin:6px 0 2px}
#heroGo.go{background:var(--c);border-color:var(--cd);color:#fff;font-size:1rem;padding:10px 22px}
#heroName{font:inherit;font-size:16px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.classes button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--bg);color:var(--fg);border:2px solid var(--line);font-weight:500;padding:10px 12px}
.classes button[aria-checked="true"]{border-color:var(--hc);box-shadow:0 0 0 3px color-mix(in srgb,var(--hc) 25%,transparent)}
.classes .cdot{width:22px;height:22px;border-radius:50%;background:var(--hc)}
.classes small{color:var(--muted);font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.stats span{background:var(--well);border-radius:10px;padding:6px 2px;font-size:.78rem;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-size:1.3rem;color:var(--fg)}
.card h4{margin:6px 0 0;font-size:.9rem}
.badges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

.badge span{font-size:.72rem;font-weight:700}

.shop div{display:flex;flex-direction:column;min-width:0}
.shop small{color:var(--muted);font-size:.8rem}
.shop button{flex:none;padding:6px 12px}
.shop button .tc{color:inherit}
button .tc i{box-shadow:0 0 0 1px rgba(0,0,0,.25)}

.zones-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;font-size:.82rem;color:var(--muted)}
.zones-head b{color:var(--fg);font-size:.95rem}
.zones .tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.zones .tabs button{display:flex;flex-direction:column;align-items:stretch;gap:5px;text-align:left;padding:7px 9px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font-weight:600;font-size:.86rem}
.zones .tabs button[aria-selected="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--fg)}
.zt{display:flex;align-items:center;gap:6px;min-width:0}
.zn{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--line);color:var(--fg)}
.tabs button[aria-selected="true"] .zn{background:var(--c);color:#fff}
.tabs button.zdone .zn{background:var(--ok);color:#fff}
.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zb{display:flex;align-items:center;gap:6px}
.zb em{flex:1;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.zb s{display:block;height:100%;width:0;background:var(--c);text-decoration:none;transition:width .4s}
.tabs button.zdone .zb s{background:var(--ok)}
.zones .tabs .tp{margin:0;font-size:.72rem;opacity:1;color:var(--muted);min-width:2.6em;text-align:right}

.h3s{margin-left:auto;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px}
.h3s.todo{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.h3s.ok{color:var(--ok);background:transparent;border:1px solid transparent}
.zonebox{border:2px solid var(--warn-line);background:var(--warn-bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.zonebox.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.zb-h b{font-size:.98rem}
.zb-miss{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem}
.chipbtn{background:var(--surface);color:var(--warn);border:1px solid var(--warn-line);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700}

.todo-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

.flash{animation:flash 1.4s ease-out;border-radius:12px}

<body>

<div class="wrap">
  <header>
    <div>
      <h1>App Inventor 群島</h1>
      <p class="sub">建立你的冒險角色，從排畫面、拼積木到手機感測器，一站一站闖關。讀懂、答對就能升級、賺金幣、收集島嶼徽章；島上的天色會跟著真實時間變化。</p>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="progress" id="progress"></div>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <div class="labels" id="labels"></div>
      <button type="button" class="overview" id="overviewBtn" hidden>← 回到群島總覽</button>
      <div class="hint" id="hint">拖曳旋轉 · 滾輪縮放 · 點島登島</div>
      <div class="travel" id="travel" hidden></div>
      <div class="hud" id="hud" hidden></div>
      <div class="clock" id="clock"></div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <div class="dlg" id="dlg" hidden><div class="dlg-who"></div><p class="dlg-text"></p><div class="dlg-nav"><button type="button" class="ghost" id="dlgSkip">略過</button><button type="button" id="dlgNext">繼續 ▶</button></div></div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <h3 id="mTitle"></h3><p id="mBody"></p><div class="mbar"><i id="mFill"></i></div>
  <div class="nav"><button type="button" id="mStay"></button><button type="button" class="ghost" id="mGo"></button></div>
</div></div>

<div class="modal" id="heroModal" hidden><div class="card wide" role="dialog" aria-modal="true"></div></div>
<div class="modal" id="bag" hidden><div class="card wide" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lab-core.js"></script>
<script src="lab-ui.js"></script>
<script>
// ================= 積木小工具（App Inventor／Blockly 風格） =================
const CAT = {
  design:['#7cb342','#558b2f'], event:['#c88330','#9c6522'], set:['#266643','#1b4a30'], get:['#3fa34d','#2d7d39'],
  method:['#7c5385','#5c3d63'], control:['#e1a91a','#b3850f'], logic:['#77ab41','#5a8a2c'], math:['#3f71b5','#2e5590'],
  text:['#b32d5e','#8c2148'], list:['#49a6d4','#2f84ae'], color:['#7d7d7d','#5e5e5e'], vars:['#d05f2d','#a6461d'],
  proc:['#7c5385','#5c3d63'], anim:['#00897b','#00695c'], sensor:['#5c6bc0','#3f51a5'],
};
const cs = c => c ? ` style="--c:${CAT[c][0]};--cd:${CAT[c][1]}"` : '';
const S = v => `<span class="slot">${v}</span>`;
const B = () => `<span class="slot b"></span>`;
const D = v => `<span class="dd">${v} ▾</span>`;
const rp = (h,c) => `<span class="blk rep"${cs(c)}>${h}</span>`;
const bo = (h,c) => `<span class="blk bool"${cs(c)}>${h}</span>`;
const st = (h,c) => `<span class="blk stk"${cs(c)}>${h}</span>`;
const hat = (h,c) => `<span class="blk hat"${cs(c)}>${h}</span>`;
const cb = (head,inner='',c,mid,inner2='') => `<span class="cblk"${cs(c)}><span class="head">${head}</span><span class="mouth">${inner}</span>${mid?`<span class="mid">${mid}</span><span class="mouth">${inner2}</span>`:''}<span class="foot"></span></span>`;
const DO = w => `<span class="do">${w}</span>`;
// 值
const T = s => rp(`" ${s} "`,'text');
const N = n => rp(n,'math');
const TRUE = rp('真','logic'), FALSE = rp('假','logic');
const COLOR = (hex,name) => rp(`<i class="sw" style="background:${hex}"></i>${name}`,'color');
const MATH = (a,op,b) => rp(`${a} ${op} ${b}`,'math');
const JOIN = (...xs) => rp(`合併 ${xs.join(' ')}`,'text');
const RND = (a,b) => rp(`從 ${a} 到 ${b} 之間的隨機整數`,'math');
// 元件
const EV = (comp,ev,inner='') => cb(`當 ${D(comp)}.${ev}${DO('執行')}`,inner,'event');
const setP = (c,p,x) => st(`設 ${D(c)}.${D(p)} 為 ${x}`,'set');
const getP = (c,p) => rp(`${D(c)}.${D(p)}`,'get');
const CALL = (c,m,args='') => st(`呼叫 ${D(c)}.${m}${args?' '+args:''}`,'method');
const CALLV = (c,m,args='') => rp(`呼叫 ${D(c)}.${m}${args?' '+args:''}`,'method');
const ALERT = x => CALL('Notifier1','顯示警告訊息',`通知 ${x}`);
const COMP = (name,kind) => rp(`<b>${name}</b> ${kind}`,'design');
const TREE = (name,inner) => cb(`<b>${name}</b>`,inner,'design');
// 變數
const GLOBAL = (n,x) => st(`初始化全域變數 ${D(n)} 為 ${x}`,'vars');
const v = n => rp(`取得 ${D('global '+n)}`,'vars');
const setv = (n,x) => st(`設 ${D('global '+n)} 為 ${x}`,'vars');
const lv = n => rp(`取得 ${D(n)}`,'vars');
const setl = (n,x) => st(`設 ${D(n)} 為 ${x}`,'vars');
const LOCAL = (n,x,inner) => cb(`初始化區域變數 ${D(n)} 為 ${x}${DO('作用範圍')}`,inner,'vars');
// 控制
const IF = (cond,inner,elseInner) => elseInner!==undefined ? cb(`如果 ${cond}${DO('則')}`,inner,'control','否則',elseInner) : cb(`如果 ${cond}${DO('則')}`,inner,'control');
const FORN = (n,a,b,s,inner) => cb(`對每個 ${D(n)} 範圍從 ${a} 到 ${b} 間隔為 ${s}${DO('執行')}`,inner,'control');
const FORL = (n,l,inner) => cb(`對每個 ${D(n)} 於清單 ${l}${DO('執行')}`,inner,'control');
const WHILE = (c,inner) => cb(`當滿足條件 ${c}${DO('執行')}`,inner,'control');
// 程序
const PROC = (n,params,inner) => cb(`定義程序 ${D(n)}${params?' '+params:''}${DO('執行')}`,inner,'proc');
const PROCR = (n,params,expr) => st(`定義程序 ${D(n)}${params?' '+params:''} 回傳 ${expr}`,'proc');
const PCALL = (n,args='') => st(`呼叫 ${D(n)}${args?' '+args:''}`,'proc');
const PCALLV = (n,args='') => rp(`呼叫 ${D(n)}${args?' '+args:''}`,'proc');
const PARAM = n => `<span class="prm">${n}</span>`;
// 清單、資料庫
const LIST = (...xs) => rp(`建立清單 ${xs.join(' ')}`,'list');
const PICK = (l,i) => rp(`選擇清單 ${l} 中索引值為 ${i} 的清單項目`,'list');
const LEN = l => rp(`求清單長度 清單 ${l}`,'list');
const DBGET = (tag,def) => CALLV('TinyDB1','取得數值',`標籤 ${T(tag)} 無標籤時之回傳值 ${def}`);
const DBSTORE = (tag,x) => CALL('TinyDB1','儲存數值',`標籤 ${T(tag)} 儲存值 ${x}`);

// 簡易語法上色（Python / JavaScript 共用）
function hl(code){
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const re = /(#[^\n]*|\/\/[^\n]*)|("[^"\n]*"|'[^'\n]*')|\b(def|for|in|range|while|if|elif|else|return|import|from|True|False|break|continue|let|const|function|of|true|false|print|len|and|or|not|new|global)\b/g;
  let out='', last=0, m;
  while((m=re.exec(code))){ out+=esc(code.slice(last,m.index)); const t=esc(m[0]);
    out+= m[1]?`<span class="c">${t}</span>`: m[2]?`<span class="s">${t}</span>`:`<span class="k">${t}</span>`; last=re.lastIndex; }
  return out+esc(code.slice(last));
}

// ================= 島嶼內容 =================
const RAW = [
 { id:'design', cat:'design', name:'設計島', region:'版面工坊', mark:'phone',
   lead:'App Inventor 的第一步：在「設計師」把手機畫面排出來。',
   learn:['元件','屬性','版面配置','即時測試'],
   sights:['格線廣場：地上畫滿排版用的格子','方向路標：水平配置往右排、垂直配置往下排','來回跑的測試員：用 AI2 Companion 即時測試'],
   topics:[
    { id:'designer', name:'設計師與元件',
      concept:['App Inventor 有兩個工作畫面：<b>設計師</b>（排畫面）和<b>程式設計</b>（拼積木）','<b>元件</b>：按鈕、標籤、文字輸入盒、圖片…從左邊「元件面板」拖到手機畫面','<b>可見元件</b>會出現在畫面上；<b>非可見元件</b>（音效、計時器、感測器、資料庫）排在手機畫面下方','每個元件都有<b>屬性</b>：文字、顏色、寬高、可見性，在右邊「屬性面板」修改','<b>版面配置</b>：水平配置、垂直配置、表格配置，讓元件排整齊','元件要<b>重新命名</b>：btnStart 比 Button1 好懂得多','手機安裝 <b>AI2 Companion</b>，連線後掃 QR code，改完馬上在手機看到'],
      blocks:[
        [COMP('Button','按鈕'),'使用者點了，就會觸發事件'],
        [COMP('Label','標籤'),'顯示文字，使用者不能改'],
        [COMP('TextBox','文字輸入盒'),'讓使用者打字'],
        [COMP('Image','圖片'),'顯示上傳的圖片素材'],
        [COMP('HorizontalArrangement','水平配置'),'裡面的元件左右排'],
        [COMP('VerticalArrangement','垂直配置'),'裡面的元件上下排'],
        [COMP('Notifier','對話框'),'非可見元件：跳出提示訊息'],
      ],
      example:{ script:[TREE('Screen1',
          COMP('lblTitle','標籤')+TREE('HorizontalArrangement1 水平配置', COMP('txtName','文字輸入盒')+COMP('btnHello','按鈕'))+COMP('imgCat','圖片'))],
        steps:['Screen1 是整個手機畫面','最上面放標題標籤','水平配置把輸入盒和按鈕排在同一列','下面再放一張圖片','元件都改成看得懂的名字'] },
      code:{ py:`import tkinter as tk
win = tk.Tk()                         # Screen1
title = tk.Label(win, text="打招呼 App")  # 標籤
row = tk.Frame(win)                   # 水平配置
name = tk.Entry(row)                  # 文字輸入盒
btn = tk.Button(row, text="打招呼")     # 按鈕

title.pack()
row.pack()
name.pack(side="left")    # 左右排
btn.pack(side="left")
win.mainloop()`,
        js:`// Screen1 = 整個網頁
const title = document.createElement("h1");   // 標籤
title.textContent = "打招呼 App";

const row = document.createElement("div");   // 水平配置
row.style.display = "flex";
const name = document.createElement("input"); // 文字輸入盒
const btn = document.createElement("button");  // 按鈕
btn.textContent = "打招呼";

row.append(name, btn);
document.body.append(title, row);` },
      oops:['元件沒改名字 → 積木裡一堆 Button1、Button2，分不清誰是誰','找不到非可見元件 → 它們排在手機畫面的下方','用很多空白標籤硬排版 → 換一支手機就亂掉，改用版面配置','寬度沒設「填滿」→ 元件只有字那麼寬'],
      tip:'先在紙上畫好畫面草圖，再到設計師拖元件，最後才去拼積木。',
      quest:{ q:'下面哪一個是<b>非可見元件</b>（不會出現在手機畫面上）？', choices:['Button 按鈕','Clock 計時器','Label 標籤'], a:1, hint:'它在背後默默計時。' } }] },

 { id:'event', cat:'event', name:'事件島', region:'點擊港', mark:'flag',
   lead:'App 打開後一直在「等」：使用者做了什麼，程式才開始跑。',
   learn:['事件驅動','事件處理程序','初始化'],
   sights:['點擊燈塔：有人按一下，燈就亮','開機鐘樓：App 一打開就敲鐘（Screen1.初始化）','揮旗的港務員：等著有人點他'],
   topics:[
    { id:'click', name:'事件與事件處理程序',
      concept:['App Inventor 是<b>事件驅動</b>：沒有事件發生，程式就在等','土黃色的「當…執行」積木叫<b>事件處理程序</b>','常見事件：按鈕被點選、被長按、螢幕初始化、文字輸入盒取得焦點','<b>Screen1.初始化</b>：App 開啟時跑一次，適合放初始設定','同一個元件的同一個事件只能有一塊積木','事件裡的積木由上往下<b>依序</b>執行'],
      blocks:[
        [EV('Button1','被點選'),'按一下按鈕'],
        [EV('Button1','被長按'),'按住不放'],
        [EV('Screen1','初始化'),'App 開啟時執行一次'],
        [EV('TextBox1','取得焦點'),'點進輸入盒的時候'],
        [EV('Screen1','按下返回鍵'),'按了手機的返回鍵'],
        [ALERT(T('嗨！')),'跳出一則小提示'],
      ],
      example:{ script:[EV('Screen1','初始化', setP('Label1','文字',T('按下按鈕開始'))), EV('Button1','被點選', setP('Label1','文字',T('你按了按鈕！'))+ALERT(T('收到！')))],
        steps:['App 一打開：標籤顯示「按下按鈕開始」','使用者按按鈕 → 觸發被點選事件','標籤改字','跳出「收到！」提示'] },
      code:{ py:`import tkinter as tk
win = tk.Tk()
label = tk.Label(win, text="按下按鈕開始")  # 初始化

def on_click():                 # 事件處理程序
    label.config(text="你按了按鈕！")

btn = tk.Button(win, text="按我", command=on_click)
label.pack(); btn.pack()
win.mainloop()                  # 開始等事件`,
        js:`// 初始化：網頁載入完成
window.addEventListener("load", () => {
  label.textContent = "按下按鈕開始";
});

// 事件處理程序：按鈕被點選
button.addEventListener("click", () => {
  label.textContent = "你按了按鈕！";
  alert("收到！");
});` },

function islandPct(it){ let a=0,b=0; it.topics.forEach(tp=>{ const ss=secsOf(tp); b+=ss.length; a+=ss.filter(s=>done[ck(it,tp,s)]).length; }); return b?a/b:0; }
const P=x=>Math.round(x*100);
function overall(){ let a=0,b=0; ISLANDS.forEach(it=>it.topics.forEach(tp=>{ const ss=secsOf(tp); b+=ss.length; a+=ss.filter(s=>done[ck(it,tp,s)]).length; })); return a/b; }

function tally(){ let got=0,q=0,isl=0; ISLANDS.forEach(it=>{ it.topics.forEach(tp=>secsOf(tp).forEach(s=>{ if(done[ck(it,tp,s)]){ if(s==='quest'||s==='lab') q++; else got++; } })); if(islandPct(it)>=1) isl++; }); return {got,q,isl}; }

function toast(html,cls=''){ const d=document.createElement('div'); d.className='toast '+cls; d.innerHTML=html; toastEl.appendChild(d); setTimeout(()=>d.remove(),2800); }
function afterChange(px,pc){

function hurt(){ if(!hero) return ''; regenHP(); if(hero.hp>=MAXHP) hero.hpAt=Date.now(); hero.hp=Math.max(0,hero.hp-1); saveHero(); renderHUD(); if(three) three.hurt();
  return hero.hp>0?`（體力 −1，剩 ${hero.hp} 顆）`:'（體力用完了，休息一下再作答）'; }
function canAnswer(fb){ if(!hero) return true; regenHP(); if(hero.hp>0) return true;

const dlg=document.getElementById('dlg'); let dlgQ=[], dlgTimer=null, dlgFull='';

function nextLine(){
  const tx=dlg.querySelector('.dlg-text'), btn=dlg.querySelector('#dlgNext');

  if(!dlgQ.length){ dlg.hidden=true; return; }
  dlgFull=dlgQ.shift(); btn.textContent=dlgQ.length?'繼續 ▶':'好！';
  if(reduce){ tx.textContent=dlgFull; return; }
  let n=0; tx.textContent=''; dlgTimer=setInterval(()=>{ n+=1; tx.textContent=dlgFull.slice(0,n); if(n>=dlgFull.length){ clearInterval(dlgTimer); dlgTimer=null; } },28);

dlg.querySelector('#dlgNext').addEventListener('click',nextLine);
dlg.querySelector('#dlgSkip').addEventListener('click',()=>{ if(dlgTimer){ clearInterval(dlgTimer); dlgTimer=null; } dlgQ=[]; dlg.hidden=true; });

// ---------- 時間（日夜） ----------
let timeMode='real'; try{ timeMode=localStorage.getItem('ai2-world-time')||'real'; }catch(e){}
const FAST_DAY=120; let fastBase=null, fastT0=0;
function hourNow(){ const d=new Date(), real=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
  if(timeMode!=='fast'){ fastBase=null; return real; }
  if(fastBase===null){ fastBase=real; fastT0=performance.now(); }
  return (fastBase+(performance.now()-fastT0)/1000*24/FAST_DAY)%24; }
const PHASES=[[5,'深夜'],[7,'清晨'],[17,'白天'],[19.5,'黃昏'],[24,'夜晚']];
const phaseName=h=>PHASES.find(([e])=>h<e)[1];
const clockEl=document.getElementById('clock');
function renderClock(){ const h=hourNow(), hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  clockEl.innerHTML=`<span class="ph">${phaseName(h)}</span><span class="tm">${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}</span><button type="button" id="timeBtn" aria-pressed="${timeMode==='fast'}">${timeMode==='fast'?'回到現在':'快轉一天'}</button>`;
  clockEl.querySelector('#timeBtn').onclick=()=>{ timeMode=timeMode==='fast'?'real':'fast'; fastBase=null; try{ localStorage.setItem('scratch-world-time',timeMode); }catch(e){} renderClock(); };
}
setInterval(renderClock,1000);

const modal=document.getElementById('modal');
function ask({title,body,pct,stay,go,color,warn},onGo){
  modal.querySelector('.card').classList.toggle('warn',!!warn);
  modal.querySelector('.card').style.setProperty('--c',color[0]); modal.querySelector('.card').style.setProperty('--cd',color[1]);
  modal.querySelector('#mTitle').textContent=title; modal.querySelector('#mBody').innerHTML=body;
  modal.querySelector('#mFill').style.width=pct+'%';
  const s=modal.querySelector('#mStay'), g=modal.querySelector('#mGo'); s.textContent=stay; g.textContent=go;
  modal.hidden=false; s.focus();
  const close=()=>{ modal.hidden=true; s.onclick=g.onclick=null; };
  s.onclick=()=>{ close(); if(!zoomed) select(current,true); };
  g.onclick=()=>{ close(); onGo(); };
}
modal.addEventListener('click',e=>{ if(e.target===modal) modal.querySelector('#mStay').click(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!modal.hidden) modal.querySelector('#mStay').click(); });

function request(j){
  if(traveling || j<0 || j>=ISLANDS.length) return;
  if(j===current){ select(j,true); if(!greeted.has(j)) greet(j); return; }
  const cur=ISLANDS[current], p=P(islandPct(cur)), tgt=ISLANDS[j];
  const skipped=ISLANDS.slice(0,j).filter((it,k)=>k!==current && islandPct(it)<1).map(it=>it.name);
  const go=()=>travel(current,j);
  if(p<100){
    ask({warn:true, title:`⚠ 警告：${cur.name}還沒學完（${p}%）`,
      body:`<b>還差：</b><ul>${leftOf(cur).map(x=>`<li>${x}</li>`).join('')}</ul>後面的島會用到這裡的觀念，建議學到 100% 再出發。${skipped.length?`<br><b>前面也還沒學完：</b>${skipped.join('、')}`:''}`,
      pct:p, stay:`留在${cur.name}繼續學`, go:'仍然出發', color:[cur.c,cur.cd]}, go);
  } else if(j>current+1 || skipped.length){
    ask({warn:true, title:`⚠ 要跳到第 ${j+1} 站「${tgt.name}」嗎？`,
      body:`中間還有沒學完的島：${skipped.join('、')||'無'}。資訊課的順序是一站接一站，跳過的觀念之後可能會看不懂。`,
      pct:p, stay:'先不要', go:'確定出發', color:[tgt.c,tgt.cd]}, go);
  } else go();
}

  // 每座島 = 一群六角地塊，大小依世界地圖的陸地比例
  const SC=1.6, T=1.0, W=Math.sqrt(3)*T, NB=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  const pick=[], groups=[];
  ISLANDS.forEach((it,i)=>{
    const g=new THREE.Group(); g.position.set(it.x,0,it.z);
    const rnd=rng(i*97+13), tiles=[[0,0]], has=new Set(['0,0']);
    while(tiles.length<it.size){ const [q,r]=tiles[Math.floor(rnd()*tiles.length)], [dq,dr]=NB[Math.floor(rnd()*6)], k=(q+dq)+','+(r+dr);
      if(!has.has(k)){ has.add(k); tiles.push([q+dq,r+dr]); } }
    let ext=0; const dec=DECOR[it.id]||[], spots=[];
    tiles.forEach(([q,r],n)=>{
      const x=W*(q+r/2), z=1.5*T*r; ext=Math.max(ext,Math.hypot(x,z));
      const inner=NB.every(([dq,dr])=>has.has((q+dq)+','+(r+dr)));
      const top=n===0?.25:(inner?.35+rnd()*.35:.15+rnd()*.15);
      const t=new THREE.Group(); t.position.set(x,0,z);
      const bm=biomeM[it.id];
      const cliff=cyl(T*.99,T*.92,.9+top,bm.cliff,6); cliff.position.y=-.6+(.9+top)/2-.15; cliff.receiveShadow=true;
      const rim=cyl(T,T,.1,catM[it.cat][0],6); rim.position.y=top-.08; rim.receiveShadow=true;
      const turf=cyl(T*.86,T*.86,.1,inner?bm.inner:bm.edge,6); turf.position.y=top-.03; turf.receiveShadow=true;
      t.add(cliff,rim,turf);
      if(n>0 && n<=dec.length) spots.push([x,z,top]);
      if(n>dec.length && rnd()<.75){ const nT=1+Math.floor(rnd()*2); for(let k=0;k<nT;k++){ const tr=tree(.7+rnd()*.4,bm); tr.position.set((rnd()-.5)*.9,top,(rnd()-.5)*.9); t.add(tr);} }
      g.add(t);
    });
    const lm=marks[it.mark](catM[it.cat]); lm.position.y=.27; g.add(lm);
    dec.forEach((fn,k)=>{ if(!spots[k]) return; const o=fn(catM[it.cat]); const [x,z,top]=spots[k]; o.position.set(x,top,z); o.rotation.y=Math.atan2(-x,-z)+Math.PI; g.add(o); if(o.userData.anim) anims.push(o.userData.anim); });
    g.traverse(o=>{ if(o.isMesh){ o.userData.idx=i; pick.push(o);} });
    g.scale.setScalar(SC);
    g.userData={lm,phase:i*.9,ext:(ext+T)*SC}; scene.add(g); groups.push(g);
    const lbl=document.createElement('button'); lbl.className='lbl'; lbl.type='button';
    lbl.style.setProperty('--c',it.c); lbl.style.setProperty('--cd',it.cd);

    lbl.addEventListener('click',()=>request(i));
    labelsEl.appendChild(lbl); it.lbl=lbl;

  // 把海縮小：保留相對方位，讓島靠緊（島與島之間只留一條航道）
  (function pack(){
    const tg=ISLANDS.map(it=>({x:it.x*.55,z:it.z*.55})), P=tg.map(p=>({...p})), GAP=2.2;
    for(let n=0;n<600;n++){
      P.forEach((p,i)=>{ p.x+=(tg[i].x-p.x)*.04; p.z+=(tg[i].z-p.z)*.04; });
      for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
        const dx=P[j].x-P[i].x, dz=P[j].z-P[i].z, d=Math.hypot(dx,dz)||.01, need=groups[i].userData.ext+groups[j].userData.ext+GAP;
        if(d<need){ const k=(need-d)/2/d; P[i].x-=dx*k; P[i].z-=dz*k; P[j].x+=dx*k; P[j].z+=dz*k; }
      }
    }
    groups.forEach((g,i)=>g.position.set(P[i].x,0,P[i].z));
  })();

      else { goal.copy(center); distGoal=overDist(); elGoal=1.05; }
    },
    travel(from,to,onPhase,onLand){
      distGoal=26; elGoal=.78;
      heliTrip(from,to,onPhase,()=>{ traveling=false; placeHero(to); onLand(); });
    }
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(applyColors,0));
  new MutationObserver(applyColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}

function travel(from,to){
  if(!three){ select(to,true); return; }
  traveling=true; zoomed=false; ovBtn.hidden=true; labelsEl.classList.add('focused');
  const tgt=ISLANDS[to], cur=ISLANDS[from];
  const say={pad:`直升機從停機坪起飛，前往${cur.name}接你…`, board:'登機！',
    fly:`直升機飛往第 ${to+1} 站 ${tgt.name}（${tgt.region}）…`, jump:`跳傘！降落到${tgt.name}…`};
  travelEl.textContent=say.pad; travelEl.hidden=false;
  ISLANDS.forEach((it,k)=>it.lbl&&it.lbl.classList.toggle('on',k===to));
  three.travel(from,to,ph=>{ travelEl.textContent=say[ph]||''; },()=>{ travelEl.hidden=true; arrive(to); });
  if(innerWidth<960) stage.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}
function arrive(to){
  select(to,true); greet(to);
  if(innerWidth<960) setTimeout(()=>panel.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}),900);
}
function select(i,zoom){
  current=i; zoomed=!!zoom&&!!three;
  ISLANDS.forEach((it,k)=>it.lbl&&it.lbl.classList.toggle('on',k===i));
  if(three){ three.focus(i,zoomed); three.placeHero(i); }
  labelsEl.classList.toggle('focused',zoomed);
  ovBtn.hidden=!zoomed;
  if(panel.scrollTop) panel.scrollTop=0;
  renderPanel(i); refreshGlobal();
}
ovBtn.addEventListener('click',()=>{ if(traveling) return; zoomed=false; ovBtn.hidden=true; labelsEl.classList.remove('focused'); if(three) three.focus(current,false); });

try{ initThree(); }catch(e){ console.error(e); three=null; }
if(!three){
  Object.assign(labelsEl.style,{position:'static',display:'flex',flexWrap:'wrap',gap:'8px',padding:'16px'});
  Object.assign(stage.style,{height:'auto',minHeight:'0'});
  document.getElementById('hint').hidden=true;
  labelsEl.innerHTML='';
  ISLANDS.forEach((it,i)=>{ const b=document.createElement('button'); b.className='lbl'; b.type='button';
    Object.assign(b.style,{position:'static',transform:'none'}); b.style.setProperty('--c',it.c); b.style.setProperty('--cd',it.cd);
    b.innerHTML=`<b>${i+1}</b><span class="nm">${it.name}</span><em class="done"></em>`; b.onclick=()=>request(i); labelsEl.appendChild(b); it.lbl=b; });
}
// 回到上次學到的島
let start=0; for(let i=0;i<ISLANDS.length;i++){ if(islandPct(ISLANDS[i])<1){ start=i; break; } if(i===ISLANDS.length-1) start=i; }
select(start,false);
renderClock(); renderHUD();
if(!hero) openHeroModal(true); else toast(`歡迎回來，${esc(hero.name)}！`);

</script>

</body>
